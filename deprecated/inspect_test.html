    ];
    var html='';
    secs.forEach(function(sec){
      var rows=sec.rows.filter(function(row){return row[1]!==null&&row[1]!==undefined&&row[1]!==''&&row[1]!=='none'&&row[1]!=='auto'&&row[1]!=='0';});
      if(!rows.length) return;
      html+='<div class="__sec"><div class="__sec-lbl">'+sec.l+'</div>';
      rows.forEach(function(row){
        if(row[2]==='color'&&row[1]){
          html+='<div class="__row"><span class="__rk">'+row[0]+'</span><span class="__rv"><span class="__swatch" style="background:'+row[1]+'"></span>'+row[1]+'</span></div>';
        } else {
          html+='<div class="__row"><span class="__rk">'+row[0]+'</span><span class="__rv">'+row[1]+'</span></div>';
        }
      });
      html+='</div>';
    });
    pb.innerHTML=html||'<div class="__hint"><div class="__hint-txt">No styles found</div></div>';
  }
})();
</script>
</body>
</html>
