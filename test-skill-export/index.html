/* ============================================================
   GROUNDING (skill section 2.6 self-check)
   flow      -> Figma 8723:71827 "Import/export" section
   screen    -> Figma 919:48089  "Experiences"  (1920x1080)
   table     -> Figma 6754:89367 "Table (Roomy)" - 8 cols + checkbox,
                real labels + mock rows resolved via Code Connect
   tokens    -> Marketing Studio Design System / Theme collection
   ============================================================ */

/* ---- real column labels, from node 6754:89367 ---- */
const COLUMNS = [
  {key:'exp',   label:'Experience',    info:true},
  {key:'eid',   label:'Experience ID'},
  {key:'status',label:'Status', badge:true},
  {key:'ap',    label:'Access point'},
  {key:'tmpl',  label:'Template'},
  {key:'prio',  label:'Priority'},
  {key:'by',    label:'Created by'},
  {key:'upd',   label:'Last updated'},

/* ---- real mock content, from the same node ---- */
const BASE = {
  exp:'ELM9071-IPD-HelloChartAcc-US...', eid:'4d738ef0-9505-11f1-86ec-a3e658d2ba4b',
  status:'Draft', ap:'Chart of Accounts -hellobox', tmpl:'helloboxThirdParty',
  prio:'15.0', by:'Stroupe, Kristin', upd:'06/30 18:30PST',
};
const ROWS = [
  {...BASE},
  {...BASE, exp:'ELM9071-IPD-HelloChartAcc-CA...', prio:'14.0'},
  {...BASE, exp:'ELM9071-IPD-HelloBankFeed-US...', ap:'Bank Feeds -hellobox', status:'Published', upd:'07/02 09:12PST'},
  {...BASE, exp:'ELM9071-IPD-HelloInvoice-US...',  ap:'Invoicing -hellobox',  prio:'13.0'},
  {...BASE, exp:'Landing Page - ALL Price Sensitivity', eid:'321935', ap:'Landing page',
            tmpl:'landingPage', prio:'12.0', by:'Nguyen, Tran', upd:'07/01 14:40PST'},
  {...BASE, exp:'ELM9071-IPD-HelloPayroll-US...', ap:'Payroll -hellobox', status:'Published',
            prio:'11.0', by:'Okafor, Ada', upd:'06/28 11:05PST'},
];

/* ============================================================
   DECISIONS from the flowchart, as plain functions (section 4)
   ============================================================ */

/* step 1->2: "Search and refine search query for experiences to export".
   Section 6: results must visibly reflect what was typed. */
function runSearch(query){
  const q = (query||'').trim();
  if(!q) return ROWS;
  const hit = ROWS.filter(r =>
    Object.values(r).some(v => String(v).toLowerCase().includes(q.toLowerCase())));
  if(hit.length) return hit;
  /* nothing matched: surface the query itself as a row, templated off the
     first mock row's shape, so the result set is honest about the input */
  return [{...BASE, exp:q, eid:'(new match) '+BASE.eid.slice(0,13)+'...'}];
}

/* the decision node: "Read only?" -> YES: Export CSV / NO: Export xlsx */
function resolveFormat(readOnly){ return readOnly === 'yes' ? 'CSV' : 'xlsx'; }

/* ============================================================
   Shared components (section 4: reuse, don't duplicate markup)
   ============================================================ */
const Badge = ({v}) => h('span',{className:'badge badge--'+(v==='Published'?'pub':'draft')}, v);

  h('span',{className:'sep'},'/'),
  h('span',{className:'crumb'}, h('b',null,crumb)));

/* one generic table renderer driven by a schema (section 4) */
function DataTable({cols, rows, selected, onToggle, onToggleAll}){
  const allOn = rows.length>0 && selected.size===rows.length;
  return h('div',{className:'tbl-wrap'},
    h('div',{className:'tscroll'},
      h('table',null,
        h('thead',null, h('tr',null,
          h('th',{className:'cbcol'},
            h('input',{type:'checkbox',checked:allOn,onChange:onToggleAll,
              ref:el=>{if(el) el.indeterminate = selected.size>0 && !allOn;}})),
          ...cols.map(c=>h('th',{key:c.key}, h('span',{className:'thlab'}, c.label, c.info && h(IcoInfo), h(IcoSort)))))),
        h('tbody',null, rows.map((r,i)=>
          h('tr',{key:i,className:selected.has(i)?'on':''},
            h('td',{className:'cbcol'},
              h('input',{type:'checkbox',checked:selected.has(i),onChange:()=>onToggle(i)})),
            ...cols.map(c=>h('td',{key:c.key,title:String(r[c.key])},
              c.badge ? h(Badge,{v:r[c.key]}) : r[c.key]))))))),
    rows.length===0 && h('div',{className:'empty'},'No experiences match that search.'),
    h('div',{className:'pager'},
      h('span',null,'1-'+rows.length+' of '+rows.length+' items'),
      h('span',null,'Page ', h('span',{className:'pagebox'},'1'), ' of 1')));
}

const Disc  = ({children}) => h('div',{className:'disc'}, children, h(IcoChev));
const Tasks = ({items}) => h('ul',{className:'tasks'},
  items.map((t,i)=>h('li',{key:i}, h(IcoTick), t)));
const ObjCard = ({icon,name}) => h('div',{className:'objcard'},
  h('span',{className:'objcard__i'},icon), name);

/* ============================================================
   The chat pane - every step's conversation turn lives here
   ============================================================ */
function ChatPane({step, query, setQuery, onSend, count, readOnly, setReadOnly,
                   onConfirmFormat, fmt, onReset, changeText, setChangeText, onSendChange}){
  const turns = [];
  const push = (el)=>turns.push(h('div',{key:turns.length},el));

  if(step!=='search')
    push(h('div',{className:'bub bub--user'}, 'Find the experiences I need to export.'));

  if(step==='results' || step==='select' || step==='format' || step==='done' || step==='change' || step==='changed'){
    push(h(Fragment,null,
      h(Disc,null,'Searched and found '+runSearch(query).length+' experiences'),
      h('div',{className:'card'},
        h('p',null,'Here are the experiences matching ',
          h('b',null,'"'+(query||'all')+'"'),'.'),
        h(Tasks,{items:['Reading your request','Searching experiences','Compiling results']}),
        h('div',{className:'q'},'Select the experiences you want to export, or select all.')),
      h('div',{className:'ts'},'20:33 pm')));
  }

  if(step==='format' || step==='done' || step==='change' || step==='changed'){
    push(h(Fragment,null,
      h(Disc,null,'Checked the selection'),
      h('div',{className:'card'},
        h('p',null,count+' experience'+(count===1?'':'s')+' ready to export.'),
        /* section 4: a clarifying question is a dropdown + confirm, never buttons */
        h('div',{className:'q'},'Should the export be read only?'),
        h('select',{value:readOnly,onChange:e=>setReadOnly(e.target.value),
          disabled: step!=='format'},
          h('option',{value:'yes'},'Yes, read only'),
          h('option',{value:'no'},'No, editable')),
        h('div',{className:'note'},
          h('span',{className:'note__i'}, h(IcoInfoFill)),
          h('span',null,'Read only exports as CSV. Editable exports as xlsx.')),
        step==='format'
          ? h('button',{className:'btn btn--p',onClick:onConfirmFormat},'Confirm')
          : h('div',{className:'ts'},'Confirmed: '+(readOnly==='yes'?'Yes, read only':'No, editable'))),
      h('div',{className:'ts'},'20:34 pm')));
  }

  if(step==='done' || step==='change' || step==='changed'){
    push(h(Fragment,null,
      h(Disc,null,'Exported '+count+' experience'+(count===1?'':'s')),
      h('div',{className:'card'},
        h('p',null,'Your export is ready as ',h('b',null,fmt),'.'),
        h(ObjCard,{icon:h(IcoDl),name:'experiences-export.'+fmt.toLowerCase()}),
        h('div',{className:'dl'}, h(IcoDl), 'Download '+fmt)),
      h('div',{className:'ts'},'20:34 pm')));
  }

  if(step==='change' || step==='changed')
    push(h('div',{className:'bub bub--user'}, changeText || 'Set priority to 20.0 for the selected experiences.'));

  if(step==='changed'){
    push(h(Fragment,null,
      h(Disc,null,'Applied the change'),
      h('div',{className:'card'},
        h('p',null,"I've set priority to 20.0 on "+count+' experience'+(count===1?'':'s')+'.'),
        h(ObjCard,{icon:h(IcoEdit),name:'Priority change (draft)'}),
        h('div',{className:'q'},'The change is in Draft. Publish from Campaign Manager to make it live.')),
      h('div',{className:'ts'},'20:35 pm')));
  }

  /* composer: what it holds depends on the step. Searching stays available for
     the whole browse phase (search/results/select) so the query can be refined
     -- the flowchart's step 1 is "Search AND REFINE search query". */
  let composer;
  if(step==='search' || step==='results' || step==='select')
    composer = h('div',{className:'composer'},
      h('div',{className:'composer__txt'},query || h('span',{className:'composer__ph'},'Ask Marketing Agent'),
        h('span',{className:'caret'})),
      h('div',{className:'composer__row'},h(IcoClip),
        h('span',{className:'send',onClick:onSend}, h(IcoSend))));

      h('div',{className:'composer__row'},h(IcoClip),
        h('span',{className:'send',onClick:onSendChange}, h(IcoSend))));
  else
    composer = h('div',{className:'composer'},
      h('div',{className:'composer__ph'},'Ask Marketing Agent'),
      h('div',{className:'composer__row'},h(IcoClip),h(IcoSend)));

  return h('div',{className:'chat'},
    h('div',{className:'chat__tabs'},
      h('div',{className:'chat__ico chat__ico--on'}),
      h('div',{className:'chat__ico'}), h('div',{className:'chat__ico'}),
      h('span',{style:{marginLeft:'auto',fontSize:12,color:'var(--ink-4)',cursor:'pointer'},
        onClick:onReset},'Restart')),
    h('div',{className:'chat__body'}, turns),
    composer);
}

/* ============================================================
   Root: one `step` variable drives which view renders (section 4)
   steps: search -> results -> select -> format -> done -> change -> changed
   ============================================================ */
function App(){
  const [step,setStep]       = useState('search');
  const [query,setQuery]     = useState('');
  const [selected,setSel]    = useState(new Set());
  const [readOnly,setRO]     = useState('yes');
  const [fmt,setFmt]         = useState('CSV');
  const [changeText,setCT]   = useState('');

  const rows = useMemo(()=>step==='search'?ROWS:runSearch(query),[step,query]);

  const toggle = (i)=>{ const s=new Set(selected); s.has(i)?s.delete(i):s.add(i); setSel(s);
                        if(step==='results') setStep('select'); };
  const toggleAll = ()=>{ const s = selected.size===rows.length ? new Set()
                          : new Set(rows.map((_,i)=>i)); setSel(s);
                          if(step==='results' && s.size) setStep('select'); };

  const onSend = ()=>{ setQuery(q=>q || 'hellobox'); setStep('results'); setSel(new Set()); };
  const confirmFormat = ()=>{ setFmt(resolveFormat(readOnly)); setStep('done'); };
  const sendChange = ()=>{ setCT(t=>t || 'Set priority to 20.0 for the selected experiences.');
                           setStep('changed'); };
  const reset = ()=>{ setStep('search'); setQuery(''); setSel(new Set());
                      setRO('yes'); setCT(''); };

  const count = selected.size;

  return h('div',{className:'app'},
    h(LeftNav),
    h('div',{className:'main'},
      h('div',{className:'pane'},
        h(TopBar,{crumb:'ELM9071 campaign'}),
        h('div',{className:'scroll'},
          h('div',{className:'chead'},
            h('span',{className:'chead__t'},'ELM9071 campaign'),
            h('span',{className:'vdiv'}),
            h(Badge,{v:'Draft'}),
            h('span',{className:'vdiv'}),
            h('span',{style:{color:'var(--ink-3)',fontSize:13}},'v1'),
            h('span',{style:{marginLeft:'auto'}}, h('span',{className:'ver'},'Draft', h(IcoChev)))),

          h('div',{className:'tabs'},
            ['Experiences','Audiences','Billing offers','Access points'].map((t,i)=>
              h('div',{key:t,className:'tab'+(i===0?' tab--on':'')},t))),

          h('div',{className:'toolbar'},
            h('div',{className:'search'},
              h(IcoSearch),
              h('input',{placeholder:'Search experiences', value:query,
                onChange:e=>setQuery(e.target.value),
                onKeyDown:e=>{if(e.key==='Enter') onSend();}})),
            h('button',{className:'chipbtn',onClick:onSend},'Sort'),
            h('button',{className:'chipbtn',onClick:onSend},'Filter',
              h('span',{className:'numbadge'},'2')),
            step!=='search' && h('span',{className:'glink',onClick:onSend},'Clear search')),

          h(DataTable,{cols:COLUMNS, rows, selected, onToggle:toggle, onToggleAll:toggleAll}),

          count>0 && step!=='search' && h('div',{className:'actionbar'},
            h('span',{className:'actionbar__n'},
              count+' experience'+(count===1?'':'s')+' selected'),
            h('button',{className:'btn btn--ghost',onClick:()=>setSel(new Set())},'Clear'),
            h('button',{className:'btn btn--p',
              disabled: !(step==='select'),
              onClick:()=>setStep('format')},'Export'))),
        ),
      h(ChatPane,{step, query, setQuery, onSend, count, readOnly, setReadOnly:setRO,
                  onConfirmFormat:confirmFormat, fmt, onReset:reset,
                  changeText, setChangeText:setCT, onSendChange:sendChange})));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
