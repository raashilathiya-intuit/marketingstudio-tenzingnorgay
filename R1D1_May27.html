<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R1-D1 — MS Ops Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f14; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(13, 15, 20, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      transition: color 0.15s;
      user-select: none;
    }
    .back:hover { color: #fff; }
    .back-arrow { font-size: 14px; }
    .back-label { letter-spacing: 0.01em; }
  </style>
</head>
<body>
  <iframe src="http://localhost:5187"></iframe>
  <a class="back" href="index.html">
    <span class="back-arrow">←</span>
    <span class="back-label">R1-D1</span>
  </a>
</body>
</html>
